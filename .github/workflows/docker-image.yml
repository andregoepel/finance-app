name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  # ghcr.io image name must be lowercase; github.repository is already lowercase here.
  IMAGE: ghcr.io/${{ github.repository }}

# Actions are pinned to commit SHAs (not mutable tags) so a retagged or
# compromised action version cannot silently enter the pipeline. The trailing
# comment records the human-readable version each SHA corresponds to.
jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write # push to GitHub Container Registry via the built-in GITHUB_TOKEN

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the Docker image
        run: |
          docker build . \
            --file ./src/AndreGoepel.FinanceApp/Dockerfile \
            --tag "$IMAGE:${{ github.sha }}" \
            --tag "$IMAGE:latest"

      # Only publish from main; pull requests build the image but do not push.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
