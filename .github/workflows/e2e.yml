name: E2E

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Actions are pinned to commit SHAs (matching ci.yml) so a retagged or compromised
# action version cannot silently enter the pipeline.
jobs:
  end-to-end:
    runs-on: ubuntu-latest
    # GitHub-hosted Linux runners ship with Docker, which Aspire.Hosting.Testing uses to
    # start the Postgres and MailHog containers for the real end-to-end run.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Install the exact SDK pinned in global.json so the implicit Blazor asset package
      # (Microsoft.AspNetCore.App.Internal.Assets) matches the lockfiles.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build E2E project
        run: dotnet build tests/AndreGoepel.FinanceApp.E2ETests/AndreGoepel.FinanceApp.E2ETests.csproj -c Release

      - name: Install Playwright browsers
        run: pwsh tests/AndreGoepel.FinanceApp.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run E2E tests
        run: dotnet test tests/AndreGoepel.FinanceApp.E2ETests/AndreGoepel.FinanceApp.E2ETests.csproj --no-build -c Release
